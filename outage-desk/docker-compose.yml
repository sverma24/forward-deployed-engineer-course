# What runs on Larkfield's own server (chapters C20 and C21). Nothing here talks to the internet.
# Ollama runs on the server itself (installed once by Larkfield's IT team), and the desk reaches it there.
#
#   docker compose -f outage-desk/docker-compose.yml up --build -d
#   curl localhost:8000/health
services:
  desk:
    build: { context: .., dockerfile: outage-desk/Dockerfile }
    ports: ["8000:8000"]
    environment:
      MODEL_BACKEND: ollama
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      GRID_URL: http://grid:8100
      GRID_API_KEY: ${GRID_API_KEY:-demo-key-123}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    depends_on: [grid]
  grid:   # stand-in for the client's grid status service
    build: { context: .., dockerfile: outage-desk/Dockerfile }
    working_dir: /app
    command: ["uv", "run", "--no-dev", "uvicorn", "server:app", "--app-dir", "client-handover/grid_api", "--host", "0.0.0.0", "--port", "8100"]
    environment: { LATENCY: "1", FLAKY: "0.15" }

[project]
name = "fde-course-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "mcp>=1.0",
    "pypdf>=6.21.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["outage-desk"]
testpaths = ["outage-desk/tests"]
